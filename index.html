<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programação de Eventos FGH</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ... (mantenha os estilos originais) ... */
        /* Adicione estilos para os campos de configuração */
        #configSection {
            display: none;
            background: #f0f4f8;
            border: 1px solid #dbe0e5;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        #configSection label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #163c6d;
        }
        #configSection input[type="text"],
        #configSection textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #d1d8e2;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        #configSection textarea {
            height: 80px;
            resize: vertical;
        }
        #configSection button {
            margin-right: 10px;
        }
        .config-toggle {
            cursor: pointer;
            color: #163c6d;
            text-decoration: underline;
            font-size: 14px;
            margin-bottom: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <!-- ... (estrutura do container como antes) ... -->
    <div class="container">
        <div id="export-wrapper">
            <div class="header-wrapper">
                <div class="title-row">
                    <img id="logoImg" src="" alt="Logo FGH" class="logo-img" style="display:none;">
                    <h1 id="dynamic-title">Programação de Eventos FGH</h1>
                </div>
                <div class="tabs-container">
                    <div id="tabsBar" class="tabs-bar"></div>
                    <button class="btn btn-success" onclick="addTab()">+ Nova aba</button>
                </div>
            </div>

            <!-- Botão para mostrar configurações -->
            <a class="config-toggle" onclick="toggleConfig()">⚙️ Configurações</a>

            <!-- Seção de configuração (Token e Logo) -->
            <div id="configSection">
                <label for="tokenInput">Token de Acesso Pessoal (GitHub):</label>
                <input type="text" id="tokenInput" placeholder="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">
                
                <label for="logoBase64Input">Logo (Base64):</label>
                <textarea id="logoBase64Input" placeholder="Cole a string base64 da imagem aqui"></textarea>
                
                <button class="btn btn-primary" onclick="saveConfig()">Salvar Configurações</button>
                <button class="btn btn-secondary" onclick="toggleConfig()">Fechar</button>
            </div>

            <!-- FERRAMENTAS -->
            <div class="toolbar">
                <label>Início do evento:</label>
                <input type="time" id="startTime" value="08:00" step="1">
                <button class="btn btn-primary" onclick="addEvent()">➕ Adicionar evento</button>
                <button class="btn btn-secondary" onclick="resetCurrentTab()">🔄 Restaurar exemplo</button>
                <button class="btn btn-warning" onclick="resetAllData()">⚠️ Resetar tudo</button>
                <button class="btn btn-success" onclick="exportToImage()">🖼️ Exportar JPEG</button>
                <button class="btn btn-success" onclick="exportToPDF()">📄 Exportar PDF</button>
            </div>

            <!-- SELETOR DE COLUNAS -->
            <div class="column-selector" id="columnSelector">
                <span class="cs-title">Colunas a exportar:</span>
            </div>

            <!-- TABELA -->
            <div id="tableContainer"></div>
        </div>
    </div>

    <script>
        // ===== UTILITÁRIOS DE TEMPO =====
        function toSeconds(val) {
            if (!val) return null;
            if (typeof val === 'number') return val;
            const parts = val.split(':').map(Number);
            if (parts.length === 1) return parts[0] * 3600;
            if (parts.length === 2) return parts[0]*3600 + parts[1]*60;
            if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
            return null;
        }
        function toHHMMSS(sec) {
            if (sec == null || isNaN(sec)) return '';
            const sign = sec < 0 ? '-' : '';
            const abs = Math.abs(sec);
            const h = Math.floor(abs / 3600);
            const m = Math.floor((abs % 3600) / 60);
            const s = Math.floor(abs % 60);
            return `${sign}${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }
        function toHHMM(sec) {
            if (sec == null || isNaN(sec)) return '';
            const sign = sec < 0 ? '-' : '';
            const abs = Math.abs(sec);
            const h = Math.floor(abs / 3600);
            const m = Math.floor((abs % 3600) / 60);
            return `${sign}${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        }

        // ===== CONFIGURAÇÃO DO GITHUB =====
        const GITHUB_OWNER = 'caiomalbuquerque';
        const GITHUB_REPO = 'programacao_de_eventos';
        const BRANCH = 'main';
        const DATA_FILE_PATH = 'programacao-eventos.json';

        let GITHUB_TOKEN = localStorage.getItem('github_token') || '';
        let LOGO_BASE64 = localStorage.getItem('logo_base64') || '';

        // ===== ESTADO GLOBAL =====
        let data = { abas: [], currentTab: 0 };
        let nextId = 1;
        const EXPORTABLE_COLUMNS = [
            { key: 'index', label: '#', className: 'col-index' },
            { key: 'event', label: 'Evento', className: 'col-event' },
            { key: 'duration', label: 'Duração (hh:mm)', className: 'col-duration' },
            { key: 'start', label: 'Início', className: 'col-start' },
            { key: 'end', label: 'Término', className: 'col-end' },
            { key: 'delay', label: 'Atraso', className: 'col-delay' }
        ];
        let exportColumns = {};

        // ===== MODELOS DE EVENTOS =====
        function getHospitalDefaultEvents() {
            return [
                { id: nextId++, name: 'Abertura', duration: 600, realEnd: '' },
                { id: nextId++, name: 'NIO', duration: 600, realEnd: '' },
                { id: nextId++, name: 'Hospital da Criança do Recife', duration: 2400, realEnd: '' },
                { id: nextId++, name: 'Compliance + Gerenciamento de Risco', duration: 1200, realEnd: '' },
                { id: nextId++, name: 'Hospital Eduardo Campos da Pessoa Idosa', duration: 2400, realEnd: '' },
                { id: nextId++, name: 'Hospital ALFA', duration: 2400, realEnd: '' },
                { id: nextId++, name: 'Superintendência de Recursos Humanos', duration: 1200, realEnd: '' },
                { id: nextId++, name: 'Superintendência de Atendimento', duration: 1200, realEnd: '' },
                { id: nextId++, name: 'Hospital Dom Helder Câmara', duration: 2400, realEnd: '' },
                { id: nextId++, name: 'Ensino e Pesquisa', duration: 1200, realEnd: '' },
                { id: nextId++, name: 'Almoço', duration: 2700, realEnd: '' },
                { id: nextId++, name: 'Tecnologia da Informação', duration: 1200, realEnd: '' },
                { id: nextId++, name: 'Superintendência da Qualidade', duration: 1200, realEnd: '' },
                { id: nextId++, name: 'Hospital Miguel Arraes', duration: 2400, realEnd: '' },
                { id: nextId++, name: 'Superintendência de Administração e Finanças', duration: 1200, realEnd: '' },
                { id: nextId++, name: 'Hospital Pelópidas Silveira', duration: 2400, realEnd: '' },
                { id: nextId++, name: 'Considerações Finais', duration: 600, realEnd: '' }
            ];
        }
        function getUPADefaultEvents() {
            return [
                { id: nextId++, name: 'Abertura', duration: 600, realEnd: '' },
                { id: nextId++, name: 'NIO', duration: 600, realEnd: '' },
                { id: nextId++, name: 'UPA São Lourenço da Mata', duration: 2100, realEnd: '' },
                { id: nextId++, name: 'UPAE Ibura', duration: 2100, realEnd: '' },
                { id: nextId++, name: 'Compliance + Gerenciamento de Risco', duration: 1200, realEnd: '' },
                { id: nextId++, name: 'UPAE Garanhuns', duration: 2100, realEnd: '' },
                { id: nextId++, name: 'Superintendência de Recursos Humanos', duration: 1200, realEnd: '' },
                { id: nextId++, name: 'UPAE Salgueiro', duration: 2100, realEnd: '' },
                { id: nextId++, name: 'Superintendência de Atendimento', duration: 1200, realEnd: '' },
                { id: nextId++, name: 'Tecnologia da Informação', duration: 1200, realEnd: '' },
                { id: nextId++, name: 'UPAE Mustardinha', duration: 2100, realEnd: '' },
                { id: nextId++, name: 'Almoço', duration: 2700, realEnd: '' },
                { id: nextId++, name: 'Ensino e Pesquisa', duration: 1200, realEnd: '' },
                { id: nextId++, name: 'UPAE Carpina', duration: 2100, realEnd: '' },
                { id: nextId++, name: 'Superintendência da Qualidade', duration: 1200, realEnd: '' },
                { id: nextId++, name: 'Superintendência de Administração e Finanças', duration: 1200, realEnd: '' },
                { id: nextId++, name: 'UPAE Escada', duration: 2100, realEnd: '' },
                { id: nextId++, name: 'Considerações Finais', duration: 600, realEnd: '' }
            ];
        }

        // ===== PERSISTÊNCIA E CONFIGURAÇÃO DE COLUNAS =====
        function loadExportColumns() {
            const raw = localStorage.getItem('programacao_eventos_fgh_export_cols');
            if (raw) {
                try {
                    exportColumns = JSON.parse(raw);
                    EXPORTABLE_COLUMNS.forEach(c => { if (!(c.key in exportColumns)) exportColumns[c.key] = true; });
                    return;
                } catch(e) {}
            }
            EXPORTABLE_COLUMNS.forEach(c => { exportColumns[c.key] = true; });
        }
        function saveExportColumns() { localStorage.setItem('programacao_eventos_fgh_export_cols', JSON.stringify(exportColumns)); }
        function renderColumnSelector() {
            const el = document.getElementById('columnSelector');
            let html = '<span class="cs-title">Colunas a exportar:</span>';
            EXPORTABLE_COLUMNS.forEach(c => {
                const checked = exportColumns[c.key] ? 'checked' : '';
                html += `<label><input type="checkbox" ${checked} onchange="onExportColumnToggle('${c.key}', this.checked)"> ${c.label}</label>`;
            });
            el.innerHTML = html;
        }
        function onExportColumnToggle(key, checked) { exportColumns[key] = checked; saveExportColumns(); }

        function applyExportColumnVisibility(apply) {
            const table = document.querySelector('#tableContainer table');
            if (!table) return;
            EXPORTABLE_COLUMNS.forEach(c => {
                const hide = apply && !exportColumns[c.key];
                const ths = table.querySelectorAll('th.' + c.className);
                const tds = table.querySelectorAll('td.' + c.className);
                ths.forEach(th => th.classList.toggle('col-hidden', hide));
                tds.forEach(td => td.classList.toggle('col-hidden', hide));
            });
        }

        // ===== FUNÇÕES DE CONFIGURAÇÃO =====
        function toggleConfig() {
            const section = document.getElementById('configSection');
            section.style.display = section.style.display === 'none' || section.style.display === '' ? 'block' : 'none';
            if (section.style.display === 'block') {
                document.getElementById('tokenInput').value = GITHUB_TOKEN;
                document.getElementById('logoBase64Input').value = LOGO_BASE64;
            }
        }

        function saveConfig() {
            GITHUB_TOKEN = document.getElementById('tokenInput').value.trim();
            LOGO_BASE64 = document.getElementById('logoBase64Input').value.trim();
            localStorage.setItem('github_token', GITHUB_TOKEN);
            localStorage.setItem('logo_base64', LOGO_BASE64);
            // Atualizar logo
            const logoImg = document.getElementById('logoImg');
            if (LOGO_BASE64) {
                logoImg.src = 'data:image/png;base64,' + LOGO_BASE64;
                logoImg.style.display = 'inline';
            } else {
                logoImg.style.display = 'none';
            }
            toggleConfig();
            alert('Configurações salvas!');
        }

        // ===== FUNÇÕES DE API GITHUB =====
        async function loadDataFromGitHub() {
            if (!GITHUB_TOKEN) {
                console.warn('Token não configurado. Usando dados padrão.');
                return getDefaultData();
            }
            const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE_PATH}?ref=${BRANCH}`;
            try {
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (response.status === 404) {
                    console.log('Arquivo de dados não encontrado. Usando padrão.');
                    return getDefaultData();
                }

                if (!response.ok) {
                    throw new Error(`Erro ao ler dados: ${response.statusText}`);
                }

                const fileData = await response.json();
                const content = atob(fileData.content);
                return JSON.parse(content);
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
                return getDefaultData();
            }
        }

        async function saveDataToGitHub(dataToSave) {
            if (!GITHUB_TOKEN) {
                console.warn('Token não configurado. Dados não serão salvos no GitHub.');
                return;
            }
            const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE_PATH}`;

            try {
                let fileSha = null;
                const getFileResponse = await fetch(url, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (getFileResponse.ok) {
                    const fileData = await getFileResponse.json();
                    fileSha = fileData.sha;
                }

                const content = btoa(unescape(encodeURIComponent(JSON.stringify(dataToSave))));

                const putResponse = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Atualização de dados do cronograma',
                        content: content,
                        branch: BRANCH,
                        sha: fileSha
                    })
                });

                if (!putResponse.ok) {
                    const errorData = await putResponse.json();
                    throw new Error(`Erro ao salvar dados: ${errorData.message}`);
                }

                console.log('Dados salvos com sucesso no GitHub!');
            } catch (error) {
                console.error('Erro ao salvar dados no GitHub:', error);
                alert(`Não foi possível salvar os dados. Erro: ${error.message}`);
            }
        }

        function getDefaultData() {
            nextId = 1;
            return {
                abas: [
                    { nome: 'Colegiado - Hospitais (26/08)', startTime: '08:00', eventos: getHospitalDefaultEvents() },
                    { nome: 'Colegiado - UPA e UPAEs (28/08)', startTime: '08:00', eventos: getUPADefaultEvents() }
                ],
                currentTab: 0
            };
        }

        // ===== CARREGAR DADOS INICIAIS =====
        async function loadData() {
            data = await loadDataFromGitHub();
            // Ajustar IDs para continuar a numeração
            let maxId = 0;
            data.abas.forEach(aba => { aba.eventos.forEach(e => { if (e.id > maxId) maxId = e.id; }); });
            nextId = maxId + 1;
        }

        async function saveData() {
            await saveDataToGitHub(data);
        }

        // ===== CÁLCULOS =====
        function computeEvents(eventos, startSec) {
            const results = [];
            let acumDelay = 0;
            for (let i = 0; i < eventos.length; i++) {
                const item = eventos[i];
                const dur = item.duration;
                let startProg;
                if (i === 0) startProg = startSec;
                else startProg = results[i-1].endProg;
                const endProg = startProg + dur;
                const realEndVal = toSeconds(item.realEnd);
                let delay = null;
                if (realEndVal !== null) delay = realEndVal - endProg;
                const startReal = startProg + acumDelay;
                if (delay !== null) acumDelay += delay;
                results.push({ ...item, startProg, startReal, endProg, realEndVal, delay, acumDelay });
            }
            return results;
        }

        // ===== RENDERIZAÇÃO =====
        function render() {
            const tabsBar = document.getElementById('tabsBar');
            const container = document.getElementById('tableContainer');
            const startInput = document.getElementById('startTime');

            let htmlTabs = '';
            data.abas.forEach((aba, idx) => {
                const active = idx === data.currentTab ? 'active' : '';
                htmlTabs += `<div class="tab-btn ${active}" onclick="switchTab(${idx})">${aba.nome}<span class="tab-actions"><button onclick="event.stopPropagation(); renameTab(${idx})">✎</button><button onclick="event.stopPropagation(); deleteTab(${idx})">✕</button></span></div>`;
            });
            tabsBar.innerHTML = htmlTabs;

            const aba = data.abas[data.currentTab];
            if (!aba) return;

            startInput.value = aba.startTime || '08:00';
            const startSec = toSeconds(startInput.value) || 8*3600;
            const computed = computeEvents(aba.eventos, startSec);

            let tableHtml = `<table><thead><tr><th class="col-index">#</th><th class="col-event">Evento</th><th class="col-duration">Duração (hh:mm)</th><th class="col-start">Início</th><th class="col-end">Término</th><th class="col-delay">Atraso</th><th class="col-actions">Ações</th></tr></thead><tbody>`;
            computed.forEach((row, idx) => {
                const delayStr = row.delay !== null ? toHHMMSS(row.delay) : '';
                const delayClass = row.delay !== null ? (row.delay > 0 ? 'atraso' : 'adiantado') : '';
                tableHtml += `<tr><td class="col-index">${idx + 1}</td><td class="col-event"><input type="text" class="editable" value="${row.name}" onchange="updateEvent(${idx}, 'name', this.value)" /></td><td class="col-duration"><input type="text" class="editable duration" value="${toHHMM(row.duration)}" onchange="updateEvent(${idx}, 'duration', this.value)" /></td><td class="col-start calculated">${toHHMMSS(row.startReal)}</td><td class="col-end"><input type="text" class="editable time" value="${row.realEnd || ''}" placeholder="HH:MM:SS" onchange="updateEvent(${idx}, 'realEnd', this.value)" /></td><td class="col-delay ${delayClass}">${delayStr}</td><td class="col-actions"><button class="move-btn" onclick="moveEvent(${idx}, -1)" title="Subir">⬆</button><button class="move-btn" onclick="moveEvent(${idx}, 1)" title="Descer">⬇</button><button class="btn btn-danger" onclick="removeEvent(${idx})">✕</button></td></tr>`;
            });
            tableHtml += `</tbody></table>`;
            container.innerHTML = tableHtml;
            saveData();
        }

        // ===== MANIPULAÇÃO =====
        function getCurrentAba() { return data.abas[data.currentTab]; }

        function updateEvent(index, field, value) {
            const aba = getCurrentAba();
            if (field === 'duration') {
                const sec = toSeconds(value);
                if (sec !== null && sec > 0) aba.eventos[index].duration = sec;
                else { alert('Duração inválida. Use HH:MM ou HH:MM:SS'); return; }
            } else if (field === 'realEnd') {
                if (value.trim() === '') aba.eventos[index].realEnd = '';
                else {
                    const sec = toSeconds(value);
                    if (sec !== null) aba.eventos[index].realEnd = toHHMMSS(sec);
                    else { alert('Hora inválida. Use HH:MM:SS'); return; }
                }
            } else {
                aba.eventos[index][field] = value;
            }
            render();
        }
        function addEvent() { getCurrentAba().eventos.push({ id: nextId++, name: 'Novo evento', duration: 1800, realEnd: '' }); render(); }
        function removeEvent(index) {
            const aba = getCurrentAba();
            if (aba.eventos.length <= 1) { alert('É necessário pelo menos um evento.'); return; }
            if (!confirm('Remover este evento?')) return;
            aba.eventos.splice(index, 1);
            render();
        }
        function moveEvent(index, direction) {
            const aba = getCurrentAba();
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= aba.eventos.length) return;
            [aba.eventos[index], aba.eventos[newIndex]] = [aba.eventos[newIndex], aba.eventos[index]];
            render();
        }

        function resetCurrentTab() {
            const aba = getCurrentAba();
            if (!confirm('Recarregar eventos de exemplo?')) return;
            const isUpa = aba.nome.toLowerCase().includes('upa');
            aba.eventos = isUpa ? getUPADefaultEvents() : getHospitalDefaultEvents();
            aba.eventos.forEach(e => { e.id = nextId++; });
            render();
        }

        function switchTab(index) { data.currentTab = index; render(); }

        function addTab() {
            const name = prompt('Nome da nova aba:', 'Novo cronograma');
            if (!name) return;
            const isUpa = confirm('Usar modelo de UPA/UPAEs? (Clique em OK para UPA, Cancelar para Hospitais)');
            const eventos = isUpa ? getUPADefaultEvents() : getHospitalDefaultEvents();
            data.abas.push({ nome: name, startTime: '08:00', eventos: eventos });
            data.abas[data.abas.length-1].eventos.forEach(e => { e.id = nextId++; });
            data.currentTab = data.abas.length - 1;
            render();
        }

        function renameTab(index) {
            const newName = prompt('Novo nome da aba:', data.abas[index].nome);
            if (newName !== null && newName.trim() !== '') { data.abas[index].nome = newName.trim(); render(); }
        }
        function deleteTab(index) {
            if (data.abas.length <= 1) { alert('Não é possível deletar a única aba.'); return; }
            if (!confirm(`Remover a aba "${data.abas[index].nome}"?`)) return;
            data.abas.splice(index, 1);
            if (data.currentTab >= data.abas.length) data.currentTab = data.abas.length - 1;
            render();
        }

        // ===== RESETAR TUDO =====
        function resetAllData() {
            if (!confirm('Isso vai apagar TODOS os seus cronogramas e recarregar os exemplos originais. Continuar?')) return;
            localStorage.removeItem('programacao_eventos_fgh_export_cols');
            // Limpar dados no GitHub (deletar arquivo? ou criar novo padrão)
            // Vamos simplesmente sobrescrever com o padrão
            data = getDefaultData();
            nextId = 1;
            // Reatribuir IDs (getDefaultData já incrementa)
            // Não precisamos de reatribuição, getDefaultData já retorna IDs corretos
            saveData();
            render();
        }

        // ===== EXPORTAÇÃO =====
        function exportToImage() {
            const wrapper = document.getElementById('export-wrapper');
            document.getElementById('dynamic-title').innerText = data.abas[data.currentTab].nome;
            wrapper.classList.add('exporting');
            applyExportColumnVisibility(true);
            html2canvas(wrapper, { scale: 2, useCORS: true, backgroundColor: '#ffffff' })
            .then(canvas => {
                const link = document.createElement('a');
                link.download = `programacao_${data.abas[data.currentTab].nome}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
                wrapper.classList.remove('exporting');
                applyExportColumnVisibility(false);
            }).catch(err => {
                alert('Erro ao gerar imagem: ' + err);
                wrapper.classList.remove('exporting');
                applyExportColumnVisibility(false);
            });
        }
        function exportToPDF() {
            const wrapper = document.getElementById('export-wrapper');
            document.getElementById('dynamic-title').innerText = data.abas[data.currentTab].nome;
            wrapper.classList.add('exporting');
            applyExportColumnVisibility(true);
            window.print();
            setTimeout(() => {
                wrapper.classList.remove('exporting');
                applyExportColumnVisibility(false);
            }, 1000);
        }

        // ===== INICIALIZAÇÃO =====
        document.addEventListener('DOMContentLoaded', async () => {
            // Carregar token e logo do localStorage
            GITHUB_TOKEN = localStorage.getItem('github_token') || '';
            LOGO_BASE64 = localStorage.getItem('logo_base64') || '';
            if (LOGO_BASE64) {
                const logoImg = document.getElementById('logoImg');
                logoImg.src = 'data:image/png;base64,' + LOGO_BASE64;
                logoImg.style.display = 'inline';
            }
            await loadData();
            loadExportColumns();
            renderColumnSelector();
            render();
            document.getElementById('startTime').addEventListener('change', function() {
                getCurrentAba().startTime = this.value;
                render();
            });
        });
    </script>
</body>
</html>
