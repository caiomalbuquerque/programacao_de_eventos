/* ============================================================
   UTILITÁRIOS DE TEMPO
============================================================ */

function toSeconds(val) {

    if (!val) return null;

    if (typeof val === 'number') {
        return val;
    }

    const parts = val.split(':').map(Number);

    if (parts.some(isNaN)) {
        return null;
    }

    if (parts.length === 1) {
        return parts[0] * 3600;
    }

    if (parts.length === 2) {
        return parts[0] * 3600 + parts[1] * 60;
    }

    if (parts.length === 3) {
        return (
            parts[0] * 3600 +
            parts[1] * 60 +
            parts[2]
        );
    }

    return null;
}


function toHHMMSS(sec) {

    if (
        sec == null ||
        isNaN(sec)
    ) {
        return '';
    }

    const sign = sec < 0 ? '-' : '';

    const abs = Math.abs(sec);

    const h = Math.floor(abs / 3600);

    const m = Math.floor(
        (abs % 3600) / 60
    );

    const s = Math.floor(abs % 60);

    return `${sign}${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}


function toHHMM(sec) {

    if (
        sec == null ||
        isNaN(sec)
    ) {
        return '';
    }

    const sign = sec < 0 ? '-' : '';

    const abs = Math.abs(sec);

    const h = Math.floor(abs / 3600);

    const m = Math.floor(
        (abs % 3600) / 60
    );

    return `${sign}${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

/* ============================================================
   GITHUB
============================================================ */

const GITHUB_OWNER =
    'caiomalbuquerque';

const GITHUB_REPO =
    'programacao_de_eventos';

const GITHUB_BRANCH =
    'main';

const GITHUB_FILE_PATH =
    'dados.json';


const CACHE_KEY = 'programacao_eventos_fgh';
const CACHE_TIME_KEY = 'programacao_eventos_fgh_cache_time';
const CACHE_DURATION = 5 * 60 * 1000; // 10 minutos

async function loadDataFromGitHub() {

    const url =
        `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_FILE_PATH}`;

    try {

        const response =
            await fetch(
                url
            );

        if (!response.ok) {
            throw new Error(
                'Arquivo ainda não existe'
            );
        }

        return await response.json();

    } catch (e) {

        console.warn(
            'Não foi possível carregar dados.json do GitHub.',
            e
        );

        return null;
    }
}


async function saveDataToGitHub() {

    const token = prompt(
        'Cole seu token de acesso do GitHub para salvar:'
    );

    if (!token) return;

    const apiUrl =
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}`;

    let sha = undefined;

    try {

        const getResp =
            await fetch(
                apiUrl +
                `?ref=${GITHUB_BRANCH}`,
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

        if (getResp.ok) {

            const fileInfo =
                await getResp.json();

            sha = fileInfo.sha;
        }

    } catch (e) {}

    const content =
        btoa(
            unescape(
                encodeURIComponent(
                    JSON.stringify(
                        data,
                        null,
                        2
                    )
                )
            )
        );

    const body = {

        message:
            `Atualiza dados - ${new Date().toLocaleString('pt-BR')}`,

        content: content,

        branch: GITHUB_BRANCH

    };

    if (sha) {
        body.sha = sha;
    }

    try {

        const putResp =
            await fetch(
                apiUrl,
                {
                    method: 'PUT',

                    headers: {
                        Authorization:
                            `Bearer ${token}`,

                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify(body)
                }
            );

        if (!putResp.ok) {

            const err =
                await putResp.json();

            throw new Error(
                err.message ||
                'Erro desconhecido'
            );
        }

        cacheDataLocally();

        localStorage.setItem(
            CACHE_TIME_KEY,
            String(Date.now())
        );

        alert(
            'Salvo no GitHub com sucesso!'
        );

    } catch (e) {

        alert(
            'Erro ao salvar no GitHub: ' +
            e.message
        );

    }
}

async function loadData() {

    const raw = localStorage.getItem(CACHE_KEY);
    const cacheTime = Number(
        localStorage.getItem(CACHE_TIME_KEY) || 0
    );

    // Usa o cache por até 10 minutos, sem consultar o GitHub.
    if (raw && cacheTime && (Date.now() - cacheTime < CACHE_DURATION)) {
        try {
            data = JSON.parse(raw);
            prepararDadosCarregados();
            return;
        } catch (e) {
            console.warn('Cache local inválido.');
        }
    }

    // Cache expirado ou inexistente: busca a versão atual no GitHub.
    const remote = await loadDataFromGitHub();

    if (remote) {
        data = remote;
        prepararDadosCarregados();

        localStorage.setItem(
            CACHE_TIME_KEY,
            String(Date.now())
        );

        cacheDataLocally();
        return;
    }

    // Se o GitHub estiver indisponível, usa o cache antigo.
    if (raw) {
        try {
            data = JSON.parse(raw);
            prepararDadosCarregados();
            console.warn('GitHub indisponível. Usando cache local antigo.');
            return;
        } catch (e) {
            console.warn('Não foi possível recuperar o cache local.');
        }
    }

    // Sem GitHub e sem cache: usa os dados padrão.
    nextId = 1;

    data = {
        abas: [
            {
                nome: 'Colegiado - Hospitais (26/08)',
                startTime: '08:00',
                eventos: getHospitalDefaultEvents()
            },
            {
                nome: 'Colegiado - UPA e UPAEs (28/08)',
                startTime: '08:00',
                eventos: getUPADefaultEvents()
            }
        ],
        currentTab: 0
    };

    const savedTab = localStorage.getItem(
        'programacao_eventos_current_tab'
    );

    if (savedTab !== null && data.abas[Number(savedTab)]) {
        data.currentTab = Number(savedTab);
    } else {
        data.currentTab = 1;
    }

    cacheDataLocally();
}

function prepararDadosCarregados() {

    let maxId = 0;

    data.abas.forEach(aba => {
        aba.eventos.forEach(e => {
            if (e.id > maxId) {
                maxId = e.id;
            }
        });
    });

    nextId = maxId + 1;

    const savedTab = localStorage.getItem(
        'programacao_eventos_current_tab'
    );

    if (savedTab !== null && data.abas[Number(savedTab)]) {
        data.currentTab = Number(savedTab);
    }
}


/* ============================================================
   CÁLCULO DOS EVENTOS
============================================================ */

function computeEvents(
    eventos,
    startSec
) {

    const results = [];

    let currentStart =
        startSec;

    for (
        let i = 0;
        i < eventos.length;
        i++
    ) {

        const item =
            eventos[i];

        const dur =
            item.duration || 0;

        let startProg;

        if (i === 0) {

            startProg =
                startSec;

        } else {

            startProg =
                results[i - 1].endProg;

        }

        const endProg =
            startProg + dur;


        const realEndVal =
            toSeconds(
                item.realEnd
            );


        let delay = null;

        if (realEndVal !== null) {

            delay =
                realEndVal -
                endProg;

        }


        let startReal;

        if (i === 0) {

            startReal =
                startSec;

        } else {

            /* 
             * ALTERAÇÃO SOLICITADA:
             * O início da linha atual agora é SEMPRE o término programado da linha anterior,
             * ignorando completamente o campo "Término" (realEnd) para este cálculo.
             */
            startReal =
                results[i - 1].endProg;

        }


        results.push({

            ...item,

            startProg,
            startReal,
            endProg,
            realEndVal,
            delay

        });

    }

    return results;
}


/* ============================================================
   RENDERIZAÇÃO
============================================================ */

function render() {

    const tabsBar =
        document.getElementById(
            'tabsBar'
        );

    const container =
        document.getElementById(
            'tableContainer'
        );

    const startInput =
        document.getElementById(
            'startTime'
        );


    /* Abas */

    let htmlTabs = '';

    data.abas.forEach(
        (aba, idx) => {

            const active =
                idx === data.currentTab
                    ? 'active'
                    : '';

            htmlTabs += `

                <div
                    class="tab-btn ${active}"
                    draggable="true"
                    ondragstart="tabDragStart(event, ${idx})"
                    ondragover="tabDragOver(event)"
                    ondrop="tabDrop(event, ${idx})"
                    ondragend="tabDragEnd(event)"
                    onclick="switchTab(${idx})"
                >

                    <span>
                        ${escapeHtml(aba.nome)}
                    </span>

                    <span class="tab-actions">

                        <button
                            onclick="event.stopPropagation(); renameTab(${idx})"
                            title="Renomear"
                        >
                            ✎
                        </button>

                        <button
                            onclick="event.stopPropagation(); deleteTab(${idx})"
                            title="Excluir"
                        >
                            ✕
                        </button>

                    </span>

                </div>

            `;
        }
    );

    tabsBar.innerHTML =
        htmlTabs;


    const aba =
        data.abas[
            data.currentTab
        ];

    if (!aba) return;


    startInput.value =
        aba.startTime ||
        '08:00';


    const startSec =
        toSeconds(
            startInput.value
        ) ||
        8 * 3600;


    const computed =
        computeEvents(
            aba.eventos,
            startSec
        );


    /* =====================================================
       TABELA
    ===================================================== */

    let tableHtml = `

        <table>

            <thead>

                <tr>

                    <th class="col-index">
                        #
                    </th>

                    <th class="col-event">
                        Evento
                    </th>

                    <th class="col-duration">
                        Duração<br>
                        (hh:mm)
                    </th>

                    <th class="col-start">
                        Início
                    </th>

                    <th class="col-end">
                        Término
                    </th>

                    <th class="col-delay">
                        Saldo de Tempo
                    </th>

                    <th class="col-actions">
                        Excluir
                    </th>

                </tr>

            </thead>

            <tbody>
    `;


    computed.forEach(
        (row, idx) => {

            const delayStr =
                row.delay !== null
                    ? toHHMMSS(
                        row.delay
                    )
                    : '';


            const delayClass =
                row.delay !== null
                    ? (
                        row.delay > 0
                            ? 'atraso'
                            : 'adiantado'
                    )
                    : '';


            tableHtml += `

                <tr draggable="true" ondragstart="dragStart(event, ${idx})" ondragover="dragOver(event)" ondrop="drop(event, ${idx})" ondragend="dragEnd(event)">

                    <td class="col-index">
                        ${idx + 1}
                    </td>


                    <td class="col-event event-cell">

                        <textarea
                            class="editable event-input"
                            oninput="autoResizeTextarea(this)"
                            onchange="updateEvent(${idx}, 'name', this.value)"
                        >${escapeHtml(row.name)}</textarea>

                    </td>


                    <td class="col-duration">

                        <input
                            type="text"
                            class="editable duration"
                            value="${toHHMM(row.duration)}"
                            onchange="updateEvent(${idx}, 'duration', this.value)"
                        >

                    </td>


                    <td class="col-start calculated">

                        ${toHHMMSS(row.startReal)}

                    </td>


                    <td class="col-end">

                        <input
                            type="text"
                            class="editable time"
                            value="${escapeAttribute(row.realEnd || '')}"
                            placeholder="HH:MM:SS"
                            onchange="updateEvent(${idx}, 'realEnd', this.value)"
                        >

                    </td>


                    <td class="col-delay ${delayClass}">

                        ${delayStr}

                    </td>


                    <td class="col-actions">

                        <button
                            class="btn btn-danger"
                            onclick="removeEvent(${idx})"
                            title="Excluir linha"
                        >
                            ✕
                        </button>

                    </td>

                </tr>

            `;

        }
    );


    tableHtml += `

            </tbody>

        </table>

    `;


    container.innerHTML =
        tableHtml;


    /*
     * Ajusta a altura dos campos de texto da coluna Evento
     * para que todo o conteúdo fique visível.
     */
    container.querySelectorAll('textarea.event-input').forEach(textarea => {
        autoResizeTextarea(textarea);
    });


    /*
     * Salva os dados.
     */

    saveData();


    /*
     * Salva também a aba atualmente selecionada.
     */

    localStorage.setItem(
        'programacao_eventos_current_tab',
        String(data.currentTab)
    );
}


/* ============================================================
   SEGURANÇA PARA TEXTO DIGITADO
============================================================ */

function escapeHtml(text) {

    if (text == null) return '';

    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}


function escapeAttribute(text) {

    return escapeHtml(text);
}


/* ============================================================
   MANIPULAÇÃO DE EVENTOS
============================================================ */

function getCurrentAba() {

    return data.abas[
        data.currentTab
    ];
}


function updateEvent(
    index,
    field,
    value
) {

    const aba =
        getCurrentAba();


    if (field === 'duration') {

        const sec =
            toSeconds(value);

        if (
            sec !== null &&
            sec > 0
        ) {

            aba.eventos[
                index
            ].duration = sec;

        } else {

            alert(
                'Duração inválida. Use HH:MM ou HH:MM:SS'
            );

            render();

            return;
        }

    }


    else if (field === 'realEnd') {

        if (
            value.trim() === ''
        ) {

            aba.eventos[
                index
            ].realEnd = '';

        }

        else {

            const sec =
                toSeconds(value);

            if (
                sec !== null
            ) {

                aba.eventos[
                    index
                ].realEnd =
                    toHHMMSS(sec);

            }

            else {

                alert(
                    'Hora inválida. Use HH:MM:SS'
                );

                render();

                return;
            }

        }

    }


    else {

        aba.eventos[
            index
        ][field] =
            value;

    }


    /*
     * Ao alterar Término,
     * o render recalcula imediatamente
     * o Início da próxima linha.
     */

    render();
}


/* ============================================================
   ADICIONAR EVENTO
============================================================ */

function addEvent() {

    getCurrentAba()
        .eventos
        .push({

            id: nextId++,

            name:
                'Novo evento',

            duration:
                1800,

            realEnd:
                ''

        });

    render();
}


/* ============================================================
   REMOVER EVENTO
============================================================ */

function removeEvent(index) {

    const aba =
        getCurrentAba();

    if (
        aba.eventos.length <= 1
    ) {

        alert(
            'É necessário pelo menos um evento.'
        );

        return;
    }

    if (
        !confirm(
            'Remover este evento?'
        )
    ) {
        return;
    }

    aba.eventos.splice(
        index,
        1
    );

    render();
}


/* ============================================================
   DRAG AND DROP DE LINHAS
============================================================ */

let draggedRow = null;
let draggedIndex = null;

function autoResizeTextarea(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
}

function dragStart(event, index) {
    draggedRow = event.currentTarget;
    draggedIndex = index;
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', index);
    draggedRow.classList.add('dragging');
}

function dragOver(event) {
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
}

function drop(event, index) {
    event.preventDefault();
    if (draggedIndex !== null && draggedIndex !== index) {
        const aba = getCurrentAba();
        const [movedItem] = aba.eventos.splice(draggedIndex, 1);
        aba.eventos.splice(index, 0, movedItem);
        render();
    }
}

function dragEnd(event) {
    draggedRow.classList.remove('dragging');
    draggedRow = null;
    draggedIndex = null;
}


/* ============================================================
   DRAG AND DROP DE ABAS
============================================================ */

let draggedTabIndex = null;
let draggedTabRow = null;

function tabDragStart(event, index) {
    draggedTabRow = event.currentTarget;
    draggedTabIndex = index;
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', index);
    draggedTabRow.classList.add('dragging');
}

function tabDragOver(event) {
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
}

function tabDrop(event, index) {
    event.preventDefault();
    if (draggedTabIndex !== null && draggedTabIndex !== index) {
        
        // Salva a aba que estava ativa antes da reordenação
        const activeTabIndex = data.currentTab;
        
        // Remove e insere a aba arrastada na nova posição
        const [movedTab] = data.abas.splice(draggedTabIndex, 1);
        data.abas.splice(index, 0, movedTab);
        
        // Ajusta o índice da aba ativa para continuar seguindo a mesma aba
        if (draggedTabIndex === activeTabIndex) {
            data.currentTab = index;
        } else if (draggedTabIndex < activeTabIndex && index >= activeTabIndex) {
            data.currentTab = activeTabIndex - 1;
        } else if (draggedTabIndex > activeTabIndex && index <= activeTabIndex) {
            data.currentTab = activeTabIndex + 1;
        }
        
        // Salva e renderiza
        saveData();
        localStorage.setItem('programacao_eventos_current_tab', String(data.currentTab));
        render();
    }
}

function tabDragEnd(event) {
    draggedTabRow.classList.remove('dragging');
    draggedTabRow = null;
    draggedTabIndex = null;
}


/* ============================================================
   RESTAURAR ABA
============================================================ */

function resetCurrentTab() {

    const aba =
        getCurrentAba();

    if (
        !confirm(
            'Recarregar eventos de exemplo?'
        )
    ) {
        return;
    }

    const isUpa =
        aba.nome
            .toLowerCase()
            .includes('upa');


    aba.eventos =
        isUpa
            ? getUPADefaultEvents()
            : getHospitalDefaultEvents();


    aba.eventos.forEach(
        e => {
            e.id =
                nextId++;
        }
    );


    render();
}


/* ============================================================
   TROCAR ABA
============================================================ */

function switchTab(index) {

    data.currentTab =
        index;


    localStorage.setItem(
        'programacao_eventos_current_tab',
        String(index)
    );


    render();
}


/* ============================================================
   NOVA ABA
============================================================ */

function addTab() {

    const name =
        prompt(
            'Nome da nova aba:',
            'Novo cronograma'
        );

    if (!name) return;


    const isUpa =
        confirm(
            'Usar modelo de UPA/UPAEs? (OK = UPA / Cancelar = Hospitais)'
        );


    const eventos =
        isUpa
            ? getUPADefaultEvents()
            : getHospitalDefaultEvents();


    data.abas.push({

        nome: name,

        startTime:
            '08:00',

        eventos:
            eventos

    });


    data.abas[
        data.abas.length - 1
    ].eventos.forEach(
        e => {
            e.id =
                nextId++;
        }
    );


    data.currentTab =
        data.abas.length - 1;


    localStorage.setItem(
        'programacao_eventos_current_tab',
        String(data.currentTab)
    );


    render();
}


/* ============================================================
   RENOMEAR ABA
============================================================ */

function renameTab(index) {

    const newName =
        prompt(
            'Novo nome da aba:',
            data.abas[index].nome
        );


    if (
        newName !== null &&
        newName.trim() !== ''
    ) {

        data.abas[index].nome =
            newName.trim();

        render();
    }
}


/* ============================================================
   EXCLUIR ABA
============================================================ */

function deleteTab(index) {

    if (
        data.abas.length <= 1
    ) {

        alert(
            'Não é possível deletar a única aba.'
        );

        return;
    }


    if (
        !confirm(
            `Remover a aba "${data.abas[index].nome}"?`
        )
    ) {
        return;
    }


    data.abas.splice(
        index,
        1
    );


    if (
        data.currentTab >=
        data.abas.length
    ) {

        data.currentTab =
            data.abas.length - 1;
    }


    localStorage.setItem(
        'programacao_eventos_current_tab',
        String(data.currentTab)
    );


    render();
}


/* ============================================================
   RESETAR TUDO
============================================================ */

function resetAllData() {

    if (
        !confirm(
            'Isso vai apagar TODOS os seus cronogramas e recarregar os exemplos originais. Continuar?'
        )
    ) {
        return;
    }


    localStorage.removeItem(
        'programacao_eventos_fgh'
    );

    localStorage.removeItem(
        'programacao_eventos_fgh_export_cols'
    );

    localStorage.removeItem(
        'programacao_eventos_current_tab'
    );


    location.reload();
}


/* ============================================================
   INICIALIZAÇÃO
============================================================ */

document.addEventListener(
    'DOMContentLoaded',
    async () => {

        await loadData();

        render();


        document
            .getElementById(
                'startTime'
            )
            .addEventListener(
                'change',
                function () {

                    getCurrentAba()
                        .startTime =
                        this.value;

                    render();
                }
            );

    }
);

</script>
