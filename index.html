<body>

<div class="container">
    <div id="export-wrapper">
        <div class="header-wrapper">
            <div class="title-row">
                <img src="images/logo_fgh.png" alt="Logo FGH" class="logo-img">

            <label>Início do evento:</label>
            <input type="time" id="startTime" value="08:00" step="1">
            <button class="btn btn-primary" onclick="addEvent()">➕ Adicionar evento</button>

            <button class="btn btn-secondary" onclick="resetCurrentTab()" style="display:none;">🔄 Restaurar exemplo</button>
            <button class="btn btn-warning" onclick="resetAllData()" style="display:none;">⚠️ Resetar tudo</button>
            <button class="btn btn-success" onclick="saveDataToGitHub()">💾 Salvar</button>
        </div>

        <div id="tableContainer" class="table-wrapper"></div>
    </div>
</div>

<script>

function toSeconds(val) {
    if (!val) return null;
    if (typeof val === 'number') return val;
    const parts = val.split(':').map(Number);
    if (parts.some(isNaN)) return null;
    if (parts.length === 1) return parts[0] * 3600;
    if (parts.length === 2) return parts[0] * 3600 + parts[1] * 60;
    if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    return null;
}

function toHHMMSS(sec) {
    if (sec == null || isNaN(sec)) return '';
    const sign = sec < 0 ? '-' : '';
    const abs = Math.abs(sec);
    const h = Math.floor(abs / 3600);
    const m = Math.floor((abs % 3600) / 60);
    const s = Math.floor(abs % 60);
    return `${sign}${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function toHHMM(sec) {
    if (sec == null || isNaN(sec)) return '';
    const sign = sec < 0 ? '-' : '';
    const abs = Math.abs(sec);
    const h = Math.floor(abs / 3600);
    const m = Math.floor((abs % 3600) / 60);
    return `${sign}${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

let data = { abas: [], currentTab: 0 };
let nextId = 1;

function getHospitalDefaultEvents() {
    return [
        { id: nextId++, name: 'Abertura', duration: 600, realEnd: '' },
        { id: nextId++, name: 'NIO', duration: 600, realEnd: '' },
        { id: nextId++, name: 'Hospital da Criança do Recife', duration: 2400, realEnd: '' },
        { id: nextId++, name: 'Compliance + Gerenciamento de Risco', duration: 1200, realEnd: '' },
        { id: nextId++, name: 'Hospital Eduardo Campos da Pessoa Idosa', duration: 2400, realEnd: '' },
        { id: nextId++, name: 'Hospital ALFA', duration: 2400, realEnd: '' },
        { id: nextId++, name: 'Superintendência de Recursos Humanos', duration: 1200, realEnd: '' },
        { id: nextId++, name: 'Superintendência de Atendimento', duration: 1200, realEnd: '' },
        { id: nextId++, name: 'Hospital Dom Helder Câmara', duration: 2400, realEnd: '' },
        { id: nextId++, name: 'Ensino e Pesquisa', duration: 1200, realEnd: '' },
        { id: nextId++, name: 'Almoço', duration: 2700, realEnd: '' },
        { id: nextId++, name: 'Tecnologia da Informação', duration: 1200, realEnd: '' },
        { id: nextId++, name: 'Superintendência da Qualidade', duration: 1200, realEnd: '' },
        { id: nextId++, name: 'Hospital Miguel Arraes', duration: 2400, realEnd: '' },
        { id: nextId++, name: 'Superintendência de Administração e Finanças', duration: 1200, realEnd: '' },
        { id: nextId++, name: 'Hospital Pelópidas Silveira', duration: 2400, realEnd: '' },
        { id: nextId++, name: 'Considerações Finais', duration: 600, realEnd: '' }
    ];
}

function getUPADefaultEvents() {
    return [
        { id: nextId++, name: 'Abertura', duration: 600, realEnd: '' },
        { id: nextId++, name: 'NIO', duration: 600, realEnd: '' },
        { id: nextId++, name: 'UPA São Lourenço da Mata', duration: 2100, realEnd: '' },
        { id: nextId++, name: 'UPAE Ibura', duration: 2100, realEnd: '' },
        { id: nextId++, name: 'Compliance + Gerenciamento de Risco', duration: 1200, realEnd: '' },
        { id: nextId++, name: 'UPAE Garanhuns', duration: 2100, realEnd: '' },
        { id: nextId++, name: 'Superintendência de Recursos Humanos', duration: 1200, realEnd: '' },
        { id: nextId++, name: 'UPAE Salgueiro', duration: 2100, realEnd: '' },
        { id: nextId++, name: 'Superintendência de Atendimento', duration: 1200, realEnd: '' },
        { id: nextId++, name: 'Tecnologia da Informação', duration: 1200, realEnd: '' },
        { id: nextId++, name: 'UPAE Mustardinha', duration: 2100, realEnd: '' },
        { id: nextId++, name: 'Almoço', duration: 2700, realEnd: '' },
        { id: nextId++, name: 'Ensino e Pesquisa', duration: 1200, realEnd: '' },
        { id: nextId++, name: 'UPAE Carpina', duration: 2100, realEnd: '' },
        { id: nextId++, name: 'Superintendência da Qualidade', duration: 1200, realEnd: '' },
        { id: nextId++, name: 'Superintendência de Administração e Finanças', duration: 1200, realEnd: '' },
        { id: nextId++, name: 'UPAE Escada', duration: 2100, realEnd: '' },
        { id: nextId++, name: 'Considerações Finais', duration: 600, realEnd: '' }
    ];
}

const GITHUB_OWNER = 'caiomalbuquerque';
const GITHUB_REPO = 'programacao_de_eventos';
const GITHUB_BRANCH = 'main';
const GITHUB_FILE_PATH = 'dados.json';
const CACHE_KEY = 'programacao_eventos_fgh';
const CACHE_TIME_KEY = 'programacao_eventos_fgh_cache_time';
const CACHE_DURATION = 5 * 60 * 1000;

async function loadDataFromGitHub() {
    const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_FILE_PATH}`;
    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Arquivo ainda não existe');
        return await response.json();
    } catch (e) {
        console.warn('Não foi possível carregar dados.json do GitHub.', e);
        return null;
    }
}

async function saveDataToGitHub() {
    const token = prompt('Cole seu token de acesso do GitHub para salvar:');
    if (!token) return;
    const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}`;
    let sha = undefined;
    try {
        const getResp = await fetch(apiUrl + `?ref=${GITHUB_BRANCH}`, { headers: { Authorization: `Bearer ${token}` } });
        if (getResp.ok) {
            const fileInfo = await getResp.json();
            sha = fileInfo.sha;
        }
    } catch (e) {}

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    const body = { message: `Atualiza dados - ${new Date().toLocaleString('pt-BR')}`, content: content, branch: GITHUB_BRANCH };
    if (sha) body.sha = sha;
    try {
        const putResp = await fetch(apiUrl, { method: 'PUT', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (!putResp.ok) { const err = await putResp.json(); throw new Error(err.message || 'Erro desconhecido'); }
        cacheDataLocally(); localStorage.setItem(CACHE_TIME_KEY, String(Date.now()));
        alert('Salvo no GitHub com sucesso!');
    } catch (e) { alert('Erro ao salvar no GitHub: ' + e.message); }
}

function cacheDataLocally() { localStorage.setItem('programacao_eventos_fgh', JSON.stringify(data)); }
function saveData() { cacheDataLocally(); }

async function loadData() {
    const raw = localStorage.getItem(CACHE_KEY);
    const cacheTime = Number(localStorage.getItem(CACHE_TIME_KEY) || 0);
    if (raw && cacheTime && (Date.now() - cacheTime < CACHE_DURATION)) {
        try { data = JSON.parse(raw); prepararDadosCarregados(); return; } catch (e) {}
    }
    const remote = await loadDataFromGitHub();
    if (remote) { data = remote; prepararDadosCarregados(); localStorage.setItem(CACHE_TIME_KEY, String(Date.now())); cacheDataLocally(); return; }
    if (raw) { try { data = JSON.parse(raw); prepararDadosCarregados(); return; } catch (e) {} }

    nextId = 1;
    data = { abas: [
        { nome: 'Colegiado - Hospitais (26/08)', startTime: '08:00', eventos: getHospitalDefaultEvents() },
        { nome: 'Colegiado - UPA e UPAEs (28/08)', startTime: '08:00', eventos: getUPADefaultEvents() }
    ], currentTab: 0 };
    const savedTab = localStorage.getItem('programacao_eventos_current_tab');
    if (savedTab !== null && data.abas[Number(savedTab)]) data.currentTab = Number(savedTab);
    else data.currentTab = 1;
    cacheDataLocally();
}

function prepararDadosCarregados() {
    let maxId = 0;
    data.abas.forEach(aba => { aba.eventos.forEach(e => { if (e.id > maxId) maxId = e.id; }); });
    nextId = maxId + 1;
    const savedTab = localStorage.getItem('programacao_eventos_current_tab');
    if (savedTab !== null && data.abas[Number(savedTab)]) data.currentTab = Number(savedTab);
}

/* ============================================================
   CÁLCULO DOS EVENTOS (LÓGICA ATUALIZADA)
============================================================ */
function computeEvents(eventos, startSec) {
    const results = [];

    for (let i = 0; i < eventos.length; i++) {
        const item = eventos[i];
        const dur = item.duration || 0;

        /* 1. Horário Programado (baseado apenas nas durações) */
        let startProg;
        if (i === 0) {
            startProg = startSec;
        } else {
            startProg = results[i - 1].endProg; // Herda o término programado da linha anterior
        }
        const endProg = startProg + dur;

        /* 2. Horário Real Digitado */
        const realEndVal = toSeconds(item.realEnd);

        /* 3. Horário de Início Real (em cascata, "puxando" o atraso da linha anterior) */
        let startReal;
        let actualEnd; // Termino real desta linha

        if (i === 0) {
            startReal = startSec;
        } else {
            const previous = results[i - 1];
            if (previous.actualEnd !== undefined) {
                startReal = previous.actualEnd;
            } else {
                startReal = previous.endProg;
            }
        }

        // Se o usuário não digitou o término real, o término real é startReal + duração
        actualEnd = (realEndVal !== null) ? realEndVal : (startReal + dur);

        /* 4. Cálculo do Saldo de Tempo (Término Real - Término Programado) */
        let delay = null;
        if (realEndVal !== null) {
            delay = realEndVal - endProg; 
        }

        results.push({
            ...item,
            startProg,
            endProg,
            startReal,
            actualEnd,
            realEndVal,
            delay
        });
    }

    return results;
}

/* ============================================================
   RENDERIZAÇÃO
============================================================ */
function render() {
    const tabsBar = document.getElementById('tabsBar');
    const container = document.getElementById('tableContainer');
    const startInput = document.getElementById('startTime');

    let htmlTabs = '';
    data.abas.forEach((aba, idx) => {
        const active = idx === data.currentTab ? 'active' : '';
        htmlTabs += `
            <div class="tab-btn ${active}" draggable="true"
                ondragstart="tabDragStart(event, ${idx})" ondragover="tabDragOver(event)" ondrop="tabDrop(event, ${idx})" ondragend="tabDragEnd(event)"
                onclick="switchTab(${idx})">
                <span>${escapeHtml(aba.nome)}</span>
                <span class="tab-actions">
                    <button onclick="event.stopPropagation(); renameTab(${idx})" title="Renomear">✎</button>
                    <button onclick="event.stopPropagation(); deleteTab(${idx})" title="Excluir">✕</button>
                </span>
            </div>`;
    });
    tabsBar.innerHTML = htmlTabs;

    const aba = data.abas[data.currentTab];
    if (!aba) return;

    startInput.value = aba.startTime || '08:00';
    const startSec = toSeconds(startInput.value) || 8 * 3600;
    const computed = computeEvents(aba.eventos, startSec);

    let tableHtml = `
        <table>
            <thead>
                <tr>
                    <th class="col-index">#</th>
                    <th class="col-event">Evento</th>
                    <th class="col-duration">Duração<br>(hh:mm)</th>
                    <th class="col-start">Início</th>
                    <th class="col-end">Término</th>
                    <th class="col-delay">Saldo de Tempo</th>
                    <th class="col-actions">Excluir</th>
                </tr>
            </thead>
            <tbody>`;

    computed.forEach((row, idx) => {
        const delayStr = row.delay !== null ? toHHMMSS(row.delay) : '';
        const delayClass = row.delay !== null ? (row.delay > 0 ? 'atraso' : 'adiantado') : '';

        tableHtml += `
            <tr draggable="true" ondragstart="dragStart(event, ${idx})" ondragover="dragOver(event)" ondrop="drop(event, ${idx})" ondragend="dragEnd(event)">
                <td class="col-index">${idx + 1}</td>
                <td class="col-event event-cell">
                    <textarea class="editable event-input" oninput="autoResizeTextarea(this)" onchange="updateEvent(${idx}, 'name', this.value)">${escapeHtml(row.name)}</textarea>
                </td>
                <td class="col-duration">
                    <input type="text" class="editable duration" value="${toHHMM(row.duration)}" onchange="updateEvent(${idx}, 'duration', this.value)">
                </td>
                <td class="col-start calculated">${toHHMMSS(row.startReal)}</td>
                <td class="col-end">
                    <input type="text" class="editable time" value="${escapeAttribute(row.realEnd || '')}" placeholder="HH:MM:SS" onchange="updateEvent(${idx}, 'realEnd', this.value)">
                </td>
                <td class="col-delay ${delayClass}">${delayStr}</td>
                <td class="col-actions">
                    <button class="btn btn-danger" onclick="removeEvent(${idx})" title="Excluir linha">✕</button>
                </td>
            </tr>`;
    });

    tableHtml += `</tbody></table>`;
    container.innerHTML = tableHtml;

    container.querySelectorAll('textarea.event-input').forEach(textarea => autoResizeTextarea(textarea));
    saveData();
    localStorage.setItem('programacao_eventos_current_tab', String(data.currentTab));
}

function escapeHtml(text) {
    if (text == null) return '';
    return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function escapeAttribute(text) { return escapeHtml(text); }

function getCurrentAba() { return data.abas[data.currentTab]; }

function updateEvent(index, field, value) {
    const aba = getCurrentAba();
    if (field === 'duration') {
        const sec = toSeconds(value);
        if (sec !== null && sec > 0) { aba.eventos[index].duration = sec; }
        else { alert('Duração inválida. Use HH:MM ou HH:MM:SS'); render(); return; }
    } else if (field === 'realEnd') {
        if (value.trim() === '') { aba.eventos[index].realEnd = ''; }
        else {
            const sec = toSeconds(value);
            if (sec !== null) { aba.eventos[index].realEnd = toHHMMSS(sec); }
            else { alert('Hora inválida. Use HH:MM:SS'); render(); return; }
        }
    } else { aba.eventos[index][field] = value; }
    render();
}

function addEvent() { getCurrentAba().eventos.push({ id: nextId++, name: 'Novo evento', duration: 1800, realEnd: '' }); render(); }

function removeEvent(index) {
    const aba = getCurrentAba();
    if (aba.eventos.length <= 1) { alert('É necessário pelo menos um evento.'); return; }
    if (!confirm('Remover este evento?')) return;
    aba.eventos.splice(index, 1); render();
}

let draggedRow = null; let draggedIndex = null;
function autoResizeTextarea(textarea) { textarea.style.height = 'auto'; textarea.style.height = textarea.scrollHeight + 'px'; }
function dragStart(event, index) { draggedRow = event.currentTarget; draggedIndex = index; event.dataTransfer.effectAllowed = 'move'; event.dataTransfer.setData('text/plain', index); draggedRow.classList.add('dragging'); }
function dragOver(event) { event.preventDefault(); event.dataTransfer.dropEffect = 'move'; }
function drop(event, index) { event.preventDefault(); if (draggedIndex !== null && draggedIndex !== index) { const aba = getCurrentAba(); const [movedItem] = aba.eventos.splice(draggedIndex, 1); aba.eventos.splice(index, 0, movedItem); render(); } }
function dragEnd(event) { draggedRow.classList.remove('dragging'); draggedRow = null; draggedIndex = null; }

let draggedTabIndex = null; let draggedTabRow = null;
function tabDragStart(event, index) { draggedTabRow = event.currentTarget; draggedTabIndex = index; event.dataTransfer.effectAllowed = 'move'; event.dataTransfer.setData('text/plain', index); draggedTabRow.classList.add('dragging'); }
function tabDragOver(event) { event.preventDefault(); event.dataTransfer.dropEffect = 'move'; }
function tabDrop(event, index) {
    event.preventDefault();
    if (draggedTabIndex !== null && draggedTabIndex !== index) {
        const activeTabIndex = data.currentTab;
        const [movedTab] = data.abas.splice(draggedTabIndex, 1);
        data.abas.splice(index, 0, movedTab);
        if (draggedTabIndex === activeTabIndex) data.currentTab = index;
        else if (draggedTabIndex < activeTabIndex && index >= activeTabIndex) data.currentTab = activeTabIndex - 1;
        else if (draggedTabIndex > activeTabIndex && index <= activeTabIndex) data.currentTab = activeTabIndex + 1;
        saveData(); localStorage.setItem('programacao_eventos_current_tab', String(data.currentTab)); render();
    }
}
function tabDragEnd(event) { draggedTabRow.classList.remove('dragging'); draggedTabRow = null; draggedTabIndex = null; }

function resetCurrentTab() {
    const aba = getCurrentAba();
    if (!confirm('Recarregar eventos de exemplo?')) return;
    const isUpa = aba.nome.toLowerCase().includes('upa');
    aba.eventos = isUpa ? getUPADefaultEvents() : getHospitalDefaultEvents();
    aba.eventos.forEach(e => { e.id = nextId++; });
    render();
}
function switchTab(index) { data.currentTab = index; localStorage.setItem('programacao_eventos_current_tab', String(index)); render(); }
function addTab() {
    const name = prompt('Nome da nova aba:', 'Novo cronograma');
    if (!name) return;
    const isUpa = confirm('Usar modelo de UPA/UPAEs? (OK = UPA / Cancelar = Hospitais)');
    const eventos = isUpa ? getUPADefaultEvents() : getHospitalDefaultEvents();
    data.abas.push({ nome: name, startTime: '08:00', eventos: eventos });
    data.abas[data.abas.length - 1].eventos.forEach(e => { e.id = nextId++; });
    data.currentTab = data.abas.length - 1;
    localStorage.setItem('programacao_eventos_current_tab', String(data.currentTab));
    render();
}
function renameTab(index) { const newName = prompt('Novo nome da aba:', data.abas[index].nome); if (newName !== null && newName.trim() !== '') { data.abas[index].nome = newName.trim(); render(); } }
function deleteTab(index) { if (data.abas.length <= 1) { alert('Não é possível deletar a única aba.'); return; } if (!confirm(`Remover a aba "${data.abas[index].nome}"?`)) return; data.abas.splice(index, 1); if (data.currentTab >= data.abas.length) data.currentTab = data.abas.length - 1; localStorage.setItem('programacao_eventos_current_tab', String(data.currentTab)); render(); }
function resetAllData() { if (!confirm('Isso vai apagar TODOS os seus cronogramas e recarregar os exemplos originais. Continuar?')) return; localStorage.removeItem('programacao_eventos_fgh'); localStorage.removeItem('programacao_eventos_fgh_export_cols'); localStorage.removeItem('programacao_eventos_current_tab'); location.reload(); }

document.addEventListener('DOMContentLoaded', async () => {
    await loadData();
    render();
    document.getElementById('startTime').addEventListener('change', function () { getCurrentAba().startTime = this.value; render(); });
});

</script>
</body>
