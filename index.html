/* ============================================================
   UTILITÁRIOS DE TEMPO
============================================================ */

function toSeconds(val) {

    if (!val) return null;

    if (typeof val === 'number') {
        return val;
    }

    const parts = val.split(':').map(Number);

    if (parts.some(isNaN)) {
        return null;
    }

    if (parts.length === 1) {
        return parts[0] * 3600;
    }

    if (parts.length === 2) {
        return parts[0] * 3600 + parts[1] * 60;
    }

    if (parts.length === 3) {
        return (
            parts[0] * 3600 +
            parts[1] * 60 +
            parts[2]
        );
    }

    return null;
}


function toHHMMSS(sec) {

    if (
        sec == null ||
        isNaN(sec)
    ) {
        return '';
    }

    const sign = sec < 0 ? '-' : '';

    const abs = Math.abs(sec);

    const h = Math.floor(abs / 3600);

    const m = Math.floor(
        (abs % 3600) / 60
    );

    const s = Math.floor(abs % 60);

    return `${sign}${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}


function toHHMM(sec) {

    if (
        sec == null ||
        isNaN(sec)
    ) {
        return '';
    }

    const sign = sec < 0 ? '-' : '';

    const abs = Math.abs(sec);

    const h = Math.floor(abs / 3600);

    const m = Math.floor(
        (abs % 3600) / 60
    );

    return `${sign}${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

function loadExportColumns() {

    const raw = localStorage.getItem(
        'programacao_eventos_fgh_export_cols'
    );

    if (raw) {

        try {

            exportColumns = JSON.parse(raw);

            EXPORTABLE_COLUMNS.forEach(c => {

                if (!(c.key in exportColumns)) {
                    exportColumns[c.key] = true;
                }

            });

            return;

        } catch (e) {}

    }

    EXPORTABLE_COLUMNS.forEach(c => {
        exportColumns[c.key] = true;
    });
}


function saveExportColumns() {

    localStorage.setItem(
        'programacao_eventos_fgh_export_cols',
        JSON.stringify(exportColumns)
    );
}

            <label>
                <input
                    type="checkbox"
                    ${checked}
                    onchange="onExportColumnToggle('${c.key}', this.checked)"
                >
                ${c.label}
            </label>
        `;
    });

    el.innerHTML = html;
}


function onExportColumnToggle(
    key,
    checked
) {

    exportColumns[key] = checked;

    saveExportColumns();
}


function applyExportColumnVisibility(apply) {

    const table =
        document.querySelector(
            '#tableContainer table'
        );

    if (!table) return;

    EXPORTABLE_COLUMNS.forEach(c => {

        const hide =
            apply &&
            !exportColumns[c.key];

        const ths =
            table.querySelectorAll(
                'th.' + c.className
            );

        const tds =
            table.querySelectorAll(
                'td.' + c.className
            );

        ths.forEach(th => {

            th.classList.toggle(
                'col-hidden',
                hide
            );

        });

        tds.forEach(td => {

            td.classList.toggle(
                'col-hidden',
                hide
            );

        });

    });
}


/* ============================================================
   GITHUB
============================================================ */

const GITHUB_OWNER =
    'caiomalbuquerque';

const GITHUB_REPO =
    'programacao_de_eventos';

const GITHUB_BRANCH =
    'main';

const GITHUB_FILE_PATH =
    'dados.json';


async function loadDataFromGitHub() {

    const url =
        `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_FILE_PATH}`;

    try {

        const response =
            await fetch(
                url + '?t=' + Date.now()
            );

        if (!response.ok) {
            throw new Error(
                'Arquivo ainda não existe'
            );
        }

        return await response.json();

    } catch (e) {

        console.warn(
            'Não foi possível carregar dados.json do GitHub.',
            e
        );

        return null;
    }
}


async function saveDataToGitHub() {

    const token = prompt(
        'Cole seu token de acesso do GitHub para salvar:'
    );

    if (!token) return;

    const apiUrl =
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}`;

    let sha = undefined;

    try {

        const getResp =
            await fetch(
                apiUrl +
                `?ref=${GITHUB_BRANCH}`,
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

        if (getResp.ok) {

            const fileInfo =
                await getResp.json();

            sha = fileInfo.sha;
        }

    } catch (e) {}

    const content =
        btoa(
            unescape(
                encodeURIComponent(
                    JSON.stringify(
                        data,
                        null,
                        2
                    )
                )
            )
        );

    const body = {

        message:
            `Atualiza dados - ${new Date().toLocaleString('pt-BR')}`,

        content: content,

        branch: GITHUB_BRANCH

    };

    if (sha) {
        body.sha = sha;
    }

    try {

        const putResp =
            await fetch(
                apiUrl,
                {
                    method: 'PUT',

                    headers: {
                        Authorization:
                            `Bearer ${token}`,

                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify(body)
                }
            );

        if (!putResp.ok) {

            const err =
                await putResp.json();

            throw new Error(
                err.message ||
                'Erro desconhecido'
            );
        }

        alert(
            'Salvo no GitHub com sucesso!'
        );

    } catch (e) {

        alert(
            'Erro ao salvar no GitHub: ' +
            e.message
        );

    }
}


/* ============================================================
   PERSISTÊNCIA LOCAL
============================================================ */

function cacheDataLocally() {

    localStorage.setItem(
        'programacao_eventos_fgh',
        JSON.stringify(data)
    );
}


function saveData() {
    cacheDataLocally();
}


/* ============================================================
   CARREGAR DADOS
============================================================ */

async function loadData() {

    const remote =
        await loadDataFromGitHub();

    if (remote) {

        let maxId = 0;

        remote.abas.forEach(
            aba => {

                aba.eventos.forEach(
                    e => {

                        if (e.id > maxId) {
                            maxId = e.id;
                        }

                    }
                );

            }
        );

        nextId = maxId + 1;

        data = remote;

        /*
         * IMPORTANTE:
         * O currentTab salvo localmente tem prioridade.
         * Isso permite que a aba atual sobreviva ao refresh.
         */

        const savedTab =
            localStorage.getItem(
                'programacao_eventos_current_tab'
            );

        if (
            savedTab !== null &&
            data.abas[
                Number(savedTab)
            ]
        ) {

            data.currentTab =
                Number(savedTab);

        }

        cacheDataLocally();

        return;
    }


    /* Tenta carregar dados locais */

    const raw =
        localStorage.getItem(
            'programacao_eventos_fgh'
        );

    if (raw) {

        try {

            const parsed =
                JSON.parse(raw);

            let maxId = 0;

            parsed.abas.forEach(
                aba => {

                    aba.eventos.forEach(
                        e => {

                            if (e.id > maxId) {
                                maxId = e.id;
                            }

                        }
                    );

                }
            );

            nextId = maxId + 1;

            data = parsed;

            const savedTab =
                localStorage.getItem(
                    'programacao_eventos_current_tab'
                );

            if (
                savedTab !== null &&
                data.abas[
                    Number(savedTab)
                ]
            ) {

                data.currentTab =
                    Number(savedTab);

            }

            return;

        } catch (e) {}
    }


    /* Dados padrão */

    nextId = 1;

    data = {

        abas: [

            {
                nome:
                    'Colegiado - Hospitais (26/08)',

                startTime:
                    '08:00',

                eventos:
                    getHospitalDefaultEvents()
            },

            {
                nome:
                    'Colegiado - UPA e UPAEs (28/08)',

                startTime:
                    '08:00',

                eventos:
                    getUPADefaultEvents()
            }

        ],

        currentTab: 0

    };

    /*
     * Se não houver uma aba salva,
     * começa na aba UPA.
     */

    const savedTab =
        localStorage.getItem(
            'programacao_eventos_current_tab'
        );

    if (
        savedTab !== null &&
        data.abas[
            Number(savedTab)
        ]
    ) {

        data.currentTab =
            Number(savedTab);

    } else {

        data.currentTab = 1;

    }

    cacheDataLocally();
}


/* ============================================================
   CÁLCULO DOS EVENTOS
============================================================ */

/*
 * REGRA PRINCIPAL:
 *
 * Evento 1:
 * início = horário inicial
 *
 * Evento seguinte:
 *
 * Se o evento anterior possui TÉRMINO REAL:
 *     início = término real anterior
 *
 * Caso contrário:
 *     início = início anterior + duração anterior
 *
 * Assim:
 *
 * Abertura
 * Início 08:00
 * Término 08:13
 *
 * Evento seguinte
 * Início 08:13
 */

function computeEvents(
    eventos,
    startSec
) {

    const results = [];

    let currentStart =
        startSec;

    for (
        let i = 0;
        i < eventos.length;
        i++
    ) {

        const item =
            eventos[i];

        const dur =
            item.duration || 0;

        /*
         * Horário programado baseado
         * somente na duração.
         */

        let startProg;

        if (i === 0) {

            startProg =
                startSec;

        } else {

            startProg =
                results[i - 1].endProg;

        }

        const endProg =
            startProg + dur;


        /*
         * Término real digitado pelo usuário.
         */

        const realEndVal =
            toSeconds(
                item.realEnd
            );


        /*
         * Atraso:
         *
         * término real - término programado
         */

        let delay = null;

        if (realEndVal !== null) {

            delay =
                realEndVal -
                endProg;

        }


        /*
         * O INÍCIO REAL é:
         *
         * 1º evento:
         * horário inicial
         *
         * Demais:
         * término real anterior,
         * caso exista.
         *
         * Caso contrário:
         * término programado anterior.
         */

        let startReal;

        if (i === 0) {

            startReal =
                startSec;

        } else {

            const previous =
                results[i - 1];

            if (
                previous.realEndVal !== null
            ) {

                startReal =
                    previous.realEndVal;

            } else {

                startReal =
                    previous.endProg;

            }

        }


        results.push({

            ...item,

            startProg,
            startReal,
            endProg,
            realEndVal,
            delay

        });

    }

    return results;
}


/* ============================================================
   RENDERIZAÇÃO
============================================================ */

function render() {

    const tabsBar =
        document.getElementById(
            'tabsBar'
        );

    const container =
        document.getElementById(
            'tableContainer'
        );

    const startInput =
        document.getElementById(
            'startTime'
        );


    /* Abas */

    let htmlTabs = '';

    data.abas.forEach(
        (aba, idx) => {

            const active =
                idx === data.currentTab
                    ? 'active'
                    : '';

            htmlTabs += `

                <div
                    class="tab-btn ${active}"
                    onclick="switchTab(${idx})"
                >

                    <span>
                        ${escapeHtml(aba.nome)}
                    </span>

                    <span class="tab-actions">

                        <button
                            onclick="event.stopPropagation(); renameTab(${idx})"
                            title="Renomear"
                        >
                            ✎
                        </button>

                        <button
                            onclick="event.stopPropagation(); deleteTab(${idx})"
                            title="Excluir"
                        >
                            ✕
                        </button>

                    </span>

                </div>

            `;
        }
    );

    tabsBar.innerHTML =
        htmlTabs;


    const aba =
        data.abas[
            data.currentTab
        ];

    if (!aba) return;


    startInput.value =
        aba.startTime ||
        '08:00';


    const startSec =
        toSeconds(
            startInput.value
        ) ||
        8 * 3600;


    const computed =
        computeEvents(
            aba.eventos,
            startSec
        );


    /* =====================================================
       TABELA
    ===================================================== */

    let tableHtml = `

        <table>

            <thead>

                <tr>

                    <th class="col-index">
                        #
                    </th>

                    <th class="col-event">
                        Evento
                    </th>

                    <th class="col-duration">
                        Duração<br>
                        (hh:mm)
                    </th>

                    <th class="col-start">
                        Início
                    </th>

                    <th class="col-end">
                        Término
                    </th>

                    <th class="col-delay">
                        Atraso
                    </th>

                    <th class="col-actions">
                        Ações
                    </th>

                </tr>

            </thead>

            <tbody>
    `;


    computed.forEach(
        (row, idx) => {

            const delayStr =
                row.delay !== null
                    ? toHHMMSS(
                        row.delay
                    )
                    : '';


            const delayClass =
                row.delay !== null
                    ? (
                        row.delay > 0
                            ? 'atraso'
                            : 'adiantado'
                    )
                    : '';


            tableHtml += `

                <tr>

                    <td class="col-index">
                        ${idx + 1}
                    </td>


                    <td class="col-event event-cell">

                        <input
                            type="text"
                            class="editable event-input"
                            value="${escapeAttribute(row.name)}"
                            onchange="updateEvent(${idx}, 'name', this.value)"
                        >

                    </td>


                    <td class="col-duration">

                        <input
                            type="text"
                            class="editable duration"
                            value="${toHHMM(row.duration)}"
                            onchange="updateEvent(${idx}, 'duration', this.value)"
                        >

                    </td>


                    <td class="col-start calculated">

                        ${toHHMMSS(row.startReal)}

                    </td>


                    <td class="col-end">

                        <input
                            type="text"
                            class="editable time"
                            value="${escapeAttribute(row.realEnd || '')}"
                            placeholder="HH:MM:SS"
                            onchange="updateEvent(${idx}, 'realEnd', this.value)"
                        >

                    </td>


                    <td class="col-delay ${delayClass}">

                        ${delayStr}

                    </td>


                    <td class="col-actions">

                        <button
                            class="move-btn"
                            onclick="moveEvent(${idx}, -1)"
                            title="Subir"
                        >
                            ⬆
                        </button>

                        <button
                            class="move-btn"
                            onclick="moveEvent(${idx}, 1)"
                            title="Descer"
                        >
                            ⬇
                        </button>

                        <button
                            class="btn btn-danger"
                            onclick="removeEvent(${idx})"
                        >
                            ✕
                        </button>

                    </td>

                </tr>

            `;

        }
    );


    tableHtml += `

            </tbody>

        </table>

    `;


    container.innerHTML =
        tableHtml;


    /*
     * Salva os dados.
     */

    saveData();


    /*
     * Salva também a aba atualmente selecionada.
     */

    localStorage.setItem(
        'programacao_eventos_current_tab',
        String(data.currentTab)
    );
}


/* ============================================================
   SEGURANÇA PARA TEXTO DIGITADO
============================================================ */

function escapeHtml(text) {

    if (text == null) return '';

    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}


function escapeAttribute(text) {

    return escapeHtml(text);
}


/* ============================================================
   MANIPULAÇÃO DE EVENTOS
============================================================ */

function getCurrentAba() {

    return data.abas[
        data.currentTab
    ];
}


function updateEvent(
    index,
    field,
    value
) {

    const aba =
        getCurrentAba();


    if (field === 'duration') {

        const sec =
            toSeconds(value);

        if (
            sec !== null &&
            sec > 0
        ) {

            aba.eventos[
                index
            ].duration = sec;

        } else {

            alert(
                'Duração inválida. Use HH:MM ou HH:MM:SS'
            );

            render();

            return;
        }

    }


    else if (field === 'realEnd') {

        if (
            value.trim() === ''
        ) {

            aba.eventos[
                index
            ].realEnd = '';

        }

        else {

            const sec =
                toSeconds(value);

            if (
                sec !== null
            ) {

                aba.eventos[
                    index
                ].realEnd =
                    toHHMMSS(sec);

            }

            else {

                alert(
                    'Hora inválida. Use HH:MM:SS'
                );

                render();

                return;
            }

        }

    }


    else {

        aba.eventos[
            index
        ][field] =
            value;

    }


    /*
     * Ao alterar Término,
     * o render recalcula imediatamente
     * o Início da próxima linha.
     */

    render();
}


/* ============================================================
   ADICIONAR EVENTO
============================================================ */

function addEvent() {

    getCurrentAba()
        .eventos
        .push({

            id: nextId++,

            name:
                'Novo evento',

            duration:
                1800,

            realEnd:
                ''

        });

    render();
}


/* ============================================================
   REMOVER EVENTO
============================================================ */

function removeEvent(index) {

    const aba =
        getCurrentAba();

    if (
        aba.eventos.length <= 1
    ) {

        alert(
            'É necessário pelo menos um evento.'
        );

        return;
    }

    if (
        !confirm(
            'Remover este evento?'
        )
    ) {
        return;
    }

    aba.eventos.splice(
        index,
        1
    );

    render();
}


/* ============================================================
   MOVER EVENTO
============================================================ */

function moveEvent(
    index,
    direction
) {

    const aba =
        getCurrentAba();

    const newIndex =
        index + direction;

    if (
        newIndex < 0 ||
        newIndex >= aba.eventos.length
    ) {
        return;
    }

    [
        aba.eventos[index],
        aba.eventos[newIndex]
    ] =
    [
        aba.eventos[newIndex],
        aba.eventos[index]
    ];

    render();
}


/* ============================================================
   RESTAURAR ABA
============================================================ */

function resetCurrentTab() {

    const aba =
        getCurrentAba();

    if (
        !confirm(
            'Recarregar eventos de exemplo?'
        )
    ) {
        return;
    }

    const isUpa =
        aba.nome
            .toLowerCase()
            .includes('upa');


    aba.eventos =
        isUpa
            ? getUPADefaultEvents()
            : getHospitalDefaultEvents();


    aba.eventos.forEach(
        e => {
            e.id =
                nextId++;
        }
    );


    render();
}


/* ============================================================
   TROCAR ABA
============================================================ */

function switchTab(index) {

    data.currentTab =
        index;


    /*
     * SALVA IMEDIATAMENTE
     * a aba selecionada.
     */

    localStorage.setItem(
        'programacao_eventos_current_tab',
        String(index)
    );


    render();
}


/* ============================================================
   NOVA ABA
============================================================ */

function addTab() {

    const name =
        prompt(
            'Nome da nova aba:',
            'Novo cronograma'
        );

    if (!name) return;


    const isUpa =
        confirm(
            'Usar modelo de UPA/UPAEs? (OK = UPA / Cancelar = Hospitais)'
        );


    const eventos =
        isUpa
            ? getUPADefaultEvents()
            : getHospitalDefaultEvents();


    data.abas.push({

        nome: name,

        startTime:
            '08:00',

        eventos:
            eventos

    });


    data.abas[
        data.abas.length - 1
    ].eventos.forEach(
        e => {
            e.id =
                nextId++;
        }
    );


    data.currentTab =
        data.abas.length - 1;


    localStorage.setItem(
        'programacao_eventos_current_tab',
        String(data.currentTab)
    );


    render();
}


/* ============================================================
   RENOMEAR ABA
============================================================ */

function renameTab(index) {

    const newName =
        prompt(
            'Novo nome da aba:',
            data.abas[index].nome
        );


    if (
        newName !== null &&
        newName.trim() !== ''
    ) {

        data.abas[index].nome =
            newName.trim();

        render();
    }
}


/* ============================================================
   EXCLUIR ABA
============================================================ */

function deleteTab(index) {

    if (
        data.abas.length <= 1
    ) {

        alert(
            'Não é possível deletar a única aba.'
        );

        return;
    }


    if (
        !confirm(
            `Remover a aba "${data.abas[index].nome}"?`
        )
    ) {
        return;
    }


    data.abas.splice(
        index,
        1
    );


    if (
        data.currentTab >=
        data.abas.length
    ) {

        data.currentTab =
            data.abas.length - 1;
    }


    localStorage.setItem(
        'programacao_eventos_current_tab',
        String(data.currentTab)
    );


    render();
}


/* ============================================================
   RESETAR TUDO
============================================================ */

function resetAllData() {

    if (
        !confirm(
            'Isso vai apagar TODOS os seus cronogramas e recarregar os exemplos originais. Continuar?'
        )
    ) {
        return;
    }


    localStorage.removeItem(
        'programacao_eventos_fgh'
    );

    localStorage.removeItem(
        'programacao_eventos_fgh_export_cols'
    );

    localStorage.removeItem(
        'programacao_eventos_current_tab'
    );


    location.reload();
}


/* ============================================================
   EXPORTAR JPEG
============================================================ */

function exportToImage() {

    const wrapper =
        document.getElementById(
            'export-wrapper'
        );


    document.getElementById(
        'dynamic-title'
    ).innerText =
        data.abas[
            data.currentTab
        ].nome;


    wrapper.classList.add(
        'exporting'
    );


    applyExportColumnVisibility(
        true
    );


    html2canvas(
        wrapper,
        {
            scale: 2,
            useCORS: true,
            backgroundColor:
                '#ffffff'
        }
    )
    .then(canvas => {

        const link =
            document.createElement(
                'a'
            );


        link.download =
            `programacao_${data.abas[data.currentTab].nome}.jpg`;


        link.href =
            canvas.toDataURL(
                'image/jpeg',
                0.95
            );


        link.click();


        wrapper.classList.remove(
            'exporting'
        );


        applyExportColumnVisibility(
            false
        );

    })
    .catch(err => {

        alert(
            'Erro ao gerar imagem: ' +
            err
        );


        wrapper.classList.remove(
            'exporting'
        );


        applyExportColumnVisibility(
            false
        );

    });
}


/* ============================================================
   EXPORTAR PDF
============================================================ */

function exportToPDF() {

    const wrapper =
        document.getElementById(
            'export-wrapper'
        );


    document.getElementById(
        'dynamic-title'
    ).innerText =
        data.abas[
            data.currentTab
        ].nome;


    wrapper.classList.add(
        'exporting'
    );


    applyExportColumnVisibility(
        true
    );


    window.print();


    setTimeout(() => {

        wrapper.classList.remove(
            'exporting'
        );

        applyExportColumnVisibility(

        );

}

document.addEventListener(

            )
